
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up · ApprenticeTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0F172A 0%,#1E293B 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#0F172A;}
  .card{width:100%;max-width:440px;background:#fff;border-radius:18px;padding:38px 34px;box-shadow:0 24px 64px rgba(0,0,0,.25);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
  .brand-icon{width:38px;height:38px;background:#0EA5E9;border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .brand-name{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.3px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px;}
  .sub{font-size:13px;color:#64748B;margin-bottom:24px;}
  label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:6px;}
  input{width:100%;padding:10px 13px;border:1px solid #E2E8F0;border-radius:9px;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border .15s;}
  input:focus{border-color:#0EA5E9;}
  .row{margin-bottom:14px;}
  .btn{width:100%;background:#0EA5E9;color:white;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:8px;transition:background .15s;}
  .btn:hover{background:#0284C7;}
  .alt{font-size:13px;color:#64748B;text-align:center;margin-top:18px;}
  .alt a{color:#0EA5E9;font-weight:600;text-decoration:none;}
  .err{background:#FEE2E2;color:#DC2626;font-size:12.5px;font-weight:500;padding:10px 14px;border-radius:8px;margin-bottom:14px;display:none;}
  .err.show{display:block;}
  .hint{font-size:11.5px;color:#94A3B8;margin-top:4px;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">A</div>
      <div class="brand-name">ApprenticeTrack</div>
    </div>
    <h1>Create your account</h1>
    <p class="sub">Sign up to start managing apprentice attendance.</p>

    <div id="err" class="err"></div>

    <form id="signupForm" onsubmit="return doSignup(event)">
      <div class="row">
        <label for="full_name">Full Name</label>
        <input id="full_name" type="text" required placeholder="e.g. Ravi Kumar" />
      </div>
      <div class="row">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="you@hal.com" />
      </div>
      <div class="row">
        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="At least 6 characters" />
        <div class="hint">Use 6 or more characters.</div>
      </div>
      <button class="btn" type="submit">Create Account</button>
    </form>

    <div class="alt">Already have an account? <a href="/login">Login</a></div>
  </div>

<script>
function showErr(msg){const e=document.getElementById('err');e.textContent=msg;e.classList.add('show');}
async function doSignup(ev){
  ev.preventDefault();
  document.getElementById('err').classList.remove('show');
  const full_name=document.getElementById('full_name').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(password.length<6){showErr('Password must be at least 6 characters.');return false;}
  try{
    const res=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name,email,password})});
    const data=await res.json();
    if(!res.ok){showErr(data.error||'Signup failed.');return false;}
    window.location.href=data.redirect||'/dashboard';
  }catch(err){showErr('Could not connect to server.');}
  return false;
}
</script>
</body>
</html>
